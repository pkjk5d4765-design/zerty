<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Catalogue</title>
<style>
  /* ============================================================
     ZONE 1 — RÉGLAGES RAPIDES
     Change ces variables pour changer les couleurs de tout le site.
  ============================================================ */
  :root{
    --paper: #F6F1E7;
    --ink: #23231F;
    --ink-soft: #6B655A;
    --line: #DCD3BF;
    --accent: #C7622A;
    --accent-soft: #EFD9C6;
    --card: #FFFFFF;
    --radius: 2px;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Georgia', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- En-tête ---------- */
  header{
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .brand h1{
    margin:0;
    font-size: 26px;
    letter-spacing: 0.2px;
    font-weight: 600;
  }
  .brand .count{
    font-family: 'Menlo','Courier New',monospace;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .tagline{
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 14px;
    font-style: italic;
  }

  .links{
    display:flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .links a{
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    text-decoration: none;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 6px 10px;
    border-radius: var(--radius);
  }
  .links a:active{ background: var(--accent-soft); }

  /* ---------- Contrôles (recherche + filtres) ---------- */
  .controls{
    padding: 16px 20px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 5;
    border-bottom: 1px solid var(--line);
  }
  #search{
    width:100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--ink);
  }
  #search:focus{ outline: 2px solid var(--accent); outline-offset: -1px; }

  .filter-row{
    display:flex;
    gap: 8px;
  }
  select{
    flex:1;
    padding: 10px 10px;
    font-size: 13px;
    font-family: -apple-system, sans-serif;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
  }

  .cat-scroller{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .cat-scroller::-webkit-scrollbar{ display:none; }
  .cat-pill{
    flex: 0 0 auto;
    font-family: -apple-system, sans-serif;
    font-size: 12.5px;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .cat-pill.active{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ---------- Grille produits ---------- */
  main{ padding: 18px 14px 60px; }
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display:flex;
    flex-direction:column;
  }
  .card .thumb{
    aspect-ratio: 1/1;
    background: var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
    overflow: hidden;
  }
  .card .thumb img{
    width:100%;
    height:100%;
    object-fit: cover;
  }
  .price{
    position:absolute;
    top: 8px;
    left: 8px;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Menlo','Courier New',monospace;
    font-size: 12px;
    padding: 4px 7px;
    border-radius: 2px;
  }
  .card .body{
    padding: 10px 10px 12px;
    display:flex;
    flex-direction:column;
    gap: 6px;
    flex:1;
  }
  .card h3{
    margin:0;
    font-size: 14.5px;
    line-height: 1.25;
    font-weight: 600;
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap: 5px;
    margin-top: auto;
  }
  .tag{
    font-family: -apple-system, sans-serif;
    font-size: 10.5px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 2px 6px;
    border-radius: 999px;
  }
  .go{
    margin-top: 6px;
    text-align:center;
    text-decoration:none;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--paper);
    background: var(--accent);
    padding: 9px 10px;
    border-radius: var(--radius);
  }
  .go:active{ opacity: 0.85; }

  .empty{
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 60px 20px;
    font-family: -apple-system, sans-serif;
  }

  footer{
    text-align:center;
    padding: 20px;
    font-size: 11px;
    color: var(--ink-soft);
    font-family: -apple-system, sans-serif;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Le Catalogue</h1>
    <span class="count" id="countLabel"></span>
  </div>
  <p class="tagline">Une sélection de produits et de liens de confiance.</p>

  <!-- ============================================================
       ZONE 2 — TES LIENS (réseaux sociaux, boutique, etc.)
       Change juste le texte entre >...< et le lien href="..."
  ============================================================ -->
  <div class="links">
    <a href="https://exemple.com" target="_blank">Instagram</a>
    <a href="https://exemple.com" target="_blank">Boutique</a>
    <a href="https://exemple.com" target="_blank">Contact</a>
  </div>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Rechercher un produit...">
  <div class="filter-row">
    <select id="vendorFilter"><option value="">Tous les vendeurs</option></select>
  </div>
  <div class="cat-scroller" id="catScroller"></div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="emptyMsg" style="display:none;">Aucun produit ne correspond à ta recherche.</p>
</main>

<footer>Fait avec ❤️ — modifie la liste PRODUITS dans le code pour ajouter les tiens.</footer>

<script>
/* ============================================================
   ZONE 3 — TES PRODUITS
   Copie un bloc { ... } pour ajouter un nouveau produit.
   - name      : nom du produit
   - price     : prix affiché (texte, ex "12€")
   - vendor    : nom du vendeur/marque
   - category  : catégorie (sert aux filtres en haut)
   - image     : lien vers une photo (URL) — laisse "" si pas de photo
   - link      : lien vers la page où on peut acheter/voir le produit
============================================================ */
const PRODUITS = [
  {
    name: "b30",
    price: "20€",
    vendor: "Vendeur A",
    category: "shoes",
    image: "",
    link: "https://exemple.com/produit-1"
  },
  {
    name: "Produit exemple 2",
    price: "25€",
    vendor: "Vendeur B",
    category: "PULL",
    image: "",
    link: "https://exemple.com/produit-2"
  },
  {
    name: "Produit exemple 3",
    price: "8€",
    vendor: "Vendeur A",
    category: "ACCESSOIRES",
    image: "",
    link: "https://exemple.com/produit-3"
  }
];

/* ============================================================
   ZONE 4 — LOGIQUE DU SITE (pas besoin de modifier en dessous)
============================================================ */
let activeCategory = "";

function uniqueValues(key){
  return [...new Set(PRODUITS.map(p => p[key]).filter(Boolean))];
}

function buildFilters(){
  const vendorSelect = document.getElementById('vendorFilter');
  uniqueValues('vendor').forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    vendorSelect.appendChild(opt);
  });

  const catScroller = document.getElementById('catScroller');
  const cats = ["Toutes", ...uniqueValues('category')];
  cats.forEach(cat => {
    const pill = document.createElement('div');
    pill.className = 'cat-pill' + (cat === "Toutes" ? ' active' : '');
    pill.textContent = cat;
    pill.onclick = () => {
      activeCategory = cat === "Toutes" ? "" : cat;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      render();
    };
    catScroller.appendChild(pill);
  });
}

function render(){
  const query = document.getElementById('search').value.trim().toLowerCase();
  const vendor = document.getElementById('vendorFilter').value;
  const grid = document.getElementById('grid');
  grid.innerHTML = "";

  const filtered = PRODUITS.filter(p => {
    const matchQuery = !query || p.name.toLowerCase().includes(query);
    const matchVendor = !vendor || p.vendor === vendor;
    const matchCat = !activeCategory || p.category === activeCategory;
    return matchQuery && matchVendor && matchCat;
  });

  document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  document.getElementById('countLabel').textContent = filtered.length + ' produit' + (filtered.length > 1 ? 's' : '');

  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">
        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : ''}
        <span class="price">${p.price}</span>
      </div>
      <div class="body">
        <h3>${p.name}</h3>
        <div class="tags">
          <span class="tag">${p.category}</span>
          <span class="tag">${p.vendor}</span>
        </div>
        <a class="go" href="${p.link}" target="_blank" rel="noopener">Voir le produit</a>
      </div>
    `;
    grid.appendChild(card);
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('vendorFilter').addEventListener('change', render);

buildFilters();
render();
</script>

</body>
</html>
